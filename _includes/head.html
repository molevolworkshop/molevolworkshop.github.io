<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ "/assets/img/favicon.png" | relative_url }}">
  {%- feed_meta -%}
  
  
{% if jekyll.environment == "production" %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
    const registeredMaterials = [
        {% for item in site.data.material_registry %}
            {% if item.material_location and item.material_location != "" %}
            {
                id: "{{ item.item_id }}",
                url: "{{ item.material_location }}",
                eventPath: "{{ item.item_id }}-{{ item.custom_url | default: 'resource' }}"
            },
            {% endif %}
        {% endfor %}
    ];

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link || !link.href) return;

        var url = link.href;
        var cleanUrl = url.split('?')[0].split('#')[0];
        var filename = cleanUrl.split('/').pop().toLowerCase();

        if (!window.goatcounter || typeof window.goatcounter.count !== 'function') return;

        // 1. Check if the clicked link is a PDF
        if (cleanUrl.endsWith('.pdf')) {
            var matchedPdfItem = registeredMaterials.find(function(m) {
                return m.url === url || m.url === cleanUrl || m.url.toLowerCase().endsWith(filename);
            });

            var eventPath = matchedPdfItem ? matchedPdfItem.id + '-download' : 'download-' + filename;
            
            window.goatcounter.count({
                path: eventPath,
                title: link.innerText || 'PDF Download',
                event: true,
            });
            return;
        }

        // 2. Check if the clicked link matches an external/custom material registry link
        var matchedMaterial = registeredMaterials.find(function(m) {
            return m.url === url || m.url === cleanUrl || url.endsWith(m.url) || m.url.endsWith(cleanUrl);
        });

        if (matchedMaterial) {
            // If it's an external link or opens in a new tab, prevent instant navigation unload
            var isExternal = link.hostname !== window.location.hostname;
            if (isExternal || link.target === '_blank') {
                e.preventDefault();
                window.goatcounter.count({
                    path: matchedMaterial.eventPath,
                    title: link.innerText || 'Material Registry Link',
                    event: true,
                });
                setTimeout(function() {
                    window.location.href = url;
                }, 150); // Small delay to let the beacon fire
            } else {
                window.goatcounter.count({
                    path: matchedMaterial.eventPath,
                    title: link.innerText || 'Material Registry Link',
                    event: true,
                });
            }
        }
    });
</script>
{% endif %}
</head>
