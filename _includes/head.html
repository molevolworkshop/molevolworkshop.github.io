<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ "/assets/img/favicon.png" | relative_url }}">
  {%- feed_meta -%}
  
  
{% if jekyll.environment == "production" %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
    // Build a lookup map of your registry items
    const registryItems = [
        {% for item in site.data.material_registry %}
        {
            id: "{{ item.item_id }}",
            location: "{{ item.material_location }}",
            eventPath: "{{ item.item_id }}-{{ item.custom_url | default: 'download' }}"
        },
        {% endfor %}
    ];

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link || !link.href) return;

        var url = link.href;
        var cleanUrl = url.split('?')[0].split('#')[0];
        var filename = cleanUrl.split('/').pop().toLowerCase();

        if (!window.goatcounter || typeof window.goatcounter.count !== 'function') return;

        // 1. Check if it matches an explicit external material_location
        var matchedExternal = registryItems.find(function(item) {
            return item.location && (item.location === url || item.location === cleanUrl || url.endsWith(item.location));
        });

        if (matchedExternal) {
            var isExternal = link.hostname !== window.location.hostname;
            if (isExternal || link.target === '_blank') {
                e.preventDefault();
                window.goatcounter.count({
                    path: matchedExternal.eventPath,
                    title: link.innerText || 'Material Registry Link',
                    event: true,
                });
                setTimeout(function() {
                    window.location.href = url;
                }, 150);
            } else {
                window.goatcounter.count({
                    path: matchedExternal.eventPath,
                    title: link.innerText || 'Material Registry Link',
                    event: true,
                });
            }
            return;
        }

        // 2. Handle blank/onsite items (PDFs or local files where material_location was left blank)
        // Try to find a registry item whose item_id matches part of the filename or path
        var matchedOnsite = registryItems.find(function(item) {
            return !item.location && (filename.includes(item.id) || cleanUrl.includes(item.id));
        });

        if (matchedOnsite) {
            window.goatcounter.count({
                path: matchedOnsite.id + '-download',
                title: link.innerText || 'Onsite Material Download',
                event: true,
            });
            return;
        }

        // 3. Absolute fallback for any other unlisted PDF
        if (cleanUrl.endsWith('.pdf')) {
            window.goatcounter.count({
                path: filename.replace('.pdf', '') + '-download',
                title: link.innerText || 'PDF Download',
                event: true,
            });
        }
    });
</script>
{% endif %}
</head>
