<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="shortcut icon" type="image/png" href="{{ "/assets/img/favicon.png" | relative_url }}">
  {%- feed_meta -%}
  
  
{% if jekyll.environment == "production" %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
    const registryItems = [
        {% for item in site.data.material_registry %}
        {
            id: "{{ item.item_id }}",
            location: "{{ item.material_location }}",
            eventPath: "{{ item.item_id }}-download"
        },
        {% endfor %}
    ];

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link || !link.href) return;

        var url = link.href;
        var cleanUrl = url.split('?')[0].split('#')[0];
        var filename = cleanUrl.split('/').pop().toLowerCase();

        if (!window.goatcounter || typeof window.goatcounter.count !== 'function') return;

        // 1. Check if the clicked link is a PDF
        if (cleanUrl.endsWith('.pdf')) {
            // See if this PDF matches an item in the registry by filename or path
            var matchedRegistryItem = registryItems.find(function(item) {
                return item.location && (item.location.toLowerCase().endsWith(filename) || cleanUrl.endsWith(item.location));
            });

            var eventPath = matchedRegistryItem ? matchedRegistryItem.eventPath : filename.replace('.pdf', '') + '-download';
            
            window.goatcounter.count({
                path: eventPath,
                title: link.innerText || 'PDF Download',
                event: true,
            });
            return;
        }

        // 2. Handle onsite items where material_location was left blank
        var matchedOnsite = registryItems.find(function(item) {
            return !item.location && (filename.includes(item.id) || cleanUrl.includes(item.id));
        });

        if (matchedOnsite) {
            window.goatcounter.count({
                path: matchedOnsite.eventPath,
                title: link.innerText || 'Onsite Material Download',
                event: true,
            });
        }
    });
</script>
{% endif %}
</head>
