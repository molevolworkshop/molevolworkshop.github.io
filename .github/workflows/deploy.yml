name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [moledata-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Latest Materials Repo
        uses: actions/checkout@v4
        with:
          repository: 'molevolworkshop/moledata'
          path: 'materials'
          fetch-depth: 1
          lfs: false
          
      - name: Create LFS Asset Index
        run: |
          cd materials
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id    
      - name: Cache LFS Data
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: materials/.git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('materials/.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Run Unified Preparation Script
        run: |
          chmod +x ./scripts/prepare-materials.sh
          ./scripts/prep_build.sh

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' 
          bundler-cache: true # Automatically runs bundle install safely!

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4