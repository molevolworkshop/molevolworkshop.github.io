name: Notify Repo on Faculty Update

on:
  push:
    branches: ["main"]
    paths:
      - '_data/faculty-registry.csv'

jobs:
  ping-data-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: molevolworkshop
          repositories: moledata 

      - name: Trigger Issue Template Update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.generate-token.outputs.token }} 
          repository: molevolworkshop/moledata
          event-type: faculty-registry-updated