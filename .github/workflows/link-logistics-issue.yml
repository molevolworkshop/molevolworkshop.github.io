name: Sync Faculty PR to Logistics Issue

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '_faculty/**'

jobs:
  link-issue:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
    
    
      - name: Link PR to mole-logistics Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            
            // 1. Get changed files in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const facultyFiles = files.filter(f => f.filename.startsWith('_faculty/'));
            if (facultyFiles.length === 0) return;

            // 2. Loop through all changed faculty files to find matching issues
            const matchedIssueNumbers = [];
            for (const facultyFile of facultyFiles) {
              let facultyName = '';
              try {
                const { data: fileData } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: facultyFile.filename,
                  ref: pr.head.sha
                });
                const content = Buffer.from(fileData.content, 'base64').toString('utf8');
                const match = content.match(/^(?:title|name):\s*["']?([^"'\n]+)["']?/m);
                if (match) facultyName = match[1].trim();
              } catch (e) {
                console.log(`Could not read faculty file ${facultyFile.filename}:`, e.message);
                continue;
              }

              if (!facultyName) continue;
              console.log(`Detected faculty name: ${facultyName}`);

              try {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: 'mole-logistics',
                  state: 'open',
                  labels: 'needs-review,faculty-profile'
                });

                const targetIssue = issues.find(issue => 
                  (issue.title && issue.title.includes(facultyName)) || 
                  (issue.body && issue.body.includes(facultyName))
                );

                if (targetIssue) {
                  console.log(`Found matching issue #${targetIssue.number} for ${facultyName}`);
                  matchedIssueNumbers.push(targetIssue.number);
                }
              } catch (err) {
                console.log('Could not fetch issues from mole-logistics:', err.message);
              }
            }

            if (matchedIssueNumbers.length === 0) return;

            // 3. Build new closing blocks with instructions
            const currentBody = pr.body || '';
            const newBlocks = [];

            for (const issueNum of matchedIssueNumbers) {
              const closeString = `Closes ${context.repo.owner}/mole-logistics#${issueNum}`;
              if (!currentBody.includes(closeString)) {
                const block = `${closeString}\n> *Note: Edit this description and delete the line above if this PR doesn't actually fix the issue.*`;
                newBlocks.push(block);
              }
            }

            // 4. Append to PR body if any new blocks need adding
            if (newBlocks.length > 0) {
              const updatedBody = currentBody + '\n\n' + newBlocks.join('\n\n');
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: updatedBody
              });
              console.log(`Appended closing references and notes to PR #${pr.number}`);
            }