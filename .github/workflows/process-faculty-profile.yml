name: Process Faculty Profile Issue

on:
  issues:
    types: [opened, edited]

jobs:
  process-profile:
    if: contains(github.event.issue.labels.*.name, 'faculty-profile')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate or Update Faculty Markdown File
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issueBody = context.payload.issue.body || '';

            // Robust parser to extract GitHub Issue Form fields into a dictionary
            const parseIssueBody = (body) => {
              const fields = {};
              const sections = body.split(/^###\s+/m);
              for (const section of sections) {
                if (!section.trim()) continue;
                const lines = section.split(/\r?\n/);
                const label = lines[0].trim();
                const value = lines.slice(1).join('\n').trim();
                fields[label] = value;
              }
              return fields;
            };

            const issueFields = parseIssueBody(issueBody);

            const getFieldValue = (label) => {
              const val = issueFields[label] || '';
              if (val === '_No response_' || val === 'None' || !val) return '';
              return val;
            };

            const selectedName = getFieldValue('Select Your Name (from Registry)');
            const customName = getFieldValue('Write-in Name (If not listed above)');

            let fullName = '';
            if (selectedName && selectedName !== '-- Not Listed / Write-in Below --') {
              fullName = selectedName;
            } else {
              fullName = customName;
            }

            if (!fullName) {
              core.setFailed("A valid name must be selected from the dropdown or provided via the write-in field.");
              return;
            }

            let slug = '';
            if (selectedName && selectedName !== '-- Not Listed / Write-in Below --') {
              try {
                const rows = fs.readFileSync('_data/faculty-registry.csv', 'utf8').trim().split('\n');
                const headers = rows[0].split(',').map(h => h.trim().replace(/['"]/g, ''));
                const match = rows.slice(1).map(r => r.split(',').map(v => v.trim().replace(/['"]/g, '')))
                  .find(r => r[headers.indexOf('name')] === selectedName);
                if (match) slug = match[headers.indexOf('ID')];
              } catch (e) {}
            }
            if (!slug) slug = fullName.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');

            // --- Check for Existing File & Parse Old Data ---
            const dirPath = path.join(process.cwd(), '_faculty');
            const filePath = path.join(dirPath, `${slug}.md`);
            
            let existingFrontmatter = {};
            let existingBio = '';
            let existingExtra = '';

            if (fs.existsSync(filePath)) {
              try {
                const fileContent = fs.readFileSync(filePath, 'utf8');
                const parts = fileContent.split('---');
                if (parts.length >= 3) {
                  parts[1].trim().split('\n').forEach(line => {
                    const colonIdx = line.indexOf(':');
                    if (colonIdx !== -1) {
                      const key = line.substring(0, colonIdx).trim();
                      const val = line.substring(colonIdx + 1).trim().replace(/^["'](.*)["']$/, '$1');
                      existingFrontmatter[key] = val;
                    }
                  });
                  const bodyParts = parts.slice(2).join('---').split('## About');
                  if (bodyParts[1]) existingBio = bodyParts[1].trim();
                }
              } catch (e) {
                console.log("Could not parse existing markdown, proceeding with new values.");
              }
            }

            // --- Get New Form Fields ---
            const workshopRole = getFieldValue('Select Your Workshop Role');
            const role = getFieldValue('Title / Role');
            const department = getFieldValue('Department');
            const institution = getFieldValue('University / Institution');
            const headshot = getFieldValue('Headshot Photo');
            const rawSocials = getFieldValue('Social Media & Contact Links');
            const arrivalDate = getFieldValue('Arrival Date');
            const departureDate = getFieldValue('Departure Date');
            const bioAbout = getFieldValue('About / Bio');
            const extraResources = getFieldValue('Other Resources & Lecture Notes');

            // --- Parse Social Links ---
            let githubHandle = '';
            let twitterHandle = '';
            let emailAddr = '';
            let mainWebsite = '';
            const otherLinks = [];

            if (rawSocials) {
              const lines = rawSocials.split('\n');
              for (let line of lines) {
                line = line.trim();
                if (!line || !line.includes(':')) continue;
                const firstColon = line.indexOf(':');
                const key = line.substring(0, firstColon).trim().toLowerCase();
                const linkVal = line.substring(firstColon + 1).trim();

                if (key === 'github') githubHandle = linkVal.replace(/^@/, '').replace('https://github.com/', '');
                else if (key === 'twitter' || key === 'x') twitterHandle = linkVal.replace(/^@/, '').replace('https://x.com/', '').replace('https://twitter.com/', '');
                else if (key === 'email') emailAddr = linkVal;
                else if (key === 'website' || key === 'lab site' || key === 'lab website') mainWebsite = linkVal;
                else otherLinks.push({ label: line.substring(0, firstColon).trim(), url: linkVal });
              }
            }

            // --- Merge with Existing Data (Fallback if new field is empty) ---
            const finalRole = role || existingFrontmatter.role || '';
            const finalDepartment = department || existingFrontmatter.department || '';
            const finalInstitution = institution || existingFrontmatter.institution || '';
            
            let cleanHeadshot = '';
            if (headshot) {
              cleanHeadshot = headshot;
              const imgMatch = headshot.match(/src="([^"]+)"/);
              if (imgMatch) cleanHeadshot = imgMatch[1];
            } else {
              cleanHeadshot = existingFrontmatter.headshot || '';
            }

            const finalGithub = githubHandle || existingFrontmatter.github || '';
            const finalTwitter = twitterHandle || existingFrontmatter.twitter || '';
            const finalEmail = emailAddr || existingFrontmatter.email || '';
            const finalWebsite = mainWebsite || existingFrontmatter.website || '';
            const finalArrival = arrivalDate || existingFrontmatter.arrival_date || '';
            const finalDeparture = departureDate || existingFrontmatter.departure_date || '';
            const finalBio = bioAbout || existingBio || '';
            const finalExtra = extraResources || existingExtra || '';

            // --- Build Frontmatter YAML Block ---
            let frontmatter = `---\n`;
            frontmatter += `layout: faculty\n`;
            frontmatter += `title: "${fullName}"\n`;
            frontmatter += `name: "${fullName}"\n`;
            if (finalRole) frontmatter += `role: "${finalRole}"\n`;
            if (finalDepartment) frontmatter += `department: "${finalDepartment}"\n`;
            if (finalInstitution) frontmatter += `institution: "${finalInstitution}"\n`;
            if (cleanHeadshot) frontmatter += `headshot: "${cleanHeadshot}"\n`;
            if (finalGithub) frontmatter += `github: "${finalGithub}"\n`;
            if (finalTwitter) frontmatter += `twitter: "${finalTwitter}"\n`;
            if (finalEmail) frontmatter += `email: "${finalEmail}"\n`;
            if (finalWebsite) frontmatter += `website: "${finalWebsite}"\n`;
            if (finalArrival) frontmatter += `arrival_date: "${finalArrival}"\n`;
            if (finalDeparture) frontmatter += `departure_date: "${finalDeparture}"\n`;

            if (otherLinks.length > 0) {
              frontmatter += `other_links:\n`;
              for (const item of otherLinks) {
                frontmatter += `  - label: "${item.label}"\n`;
                frontmatter += `    url: "${item.url}"\n`;
              }
            }
            frontmatter += `---\n\n`;

            // --- Build Markdown Body ---
            let bodyContent = `## About\n\n${finalBio}\n`;
            if (finalExtra) {
              bodyContent += `\n\n${finalExtra}\n`;
            }

            const fullMarkdown = frontmatter + bodyContent;

            if (!fs.existsSync(dirPath)){
                fs.mkdirSync(dirPath, { recursive: true });
            }

            fs.writeFileSync(filePath, fullMarkdown, 'utf8');

            core.exportVariable('FACULTY_SLUG', slug);
            core.exportVariable('FACULTY_NAME', fullName);

      - name: Find Cross-Repo Issue 
        uses: actions/github-script@v7
        with:
          script: |
            const submitterName = process.env.FACULTY_NAME || '';
            let targetIssueNumber = '';

            try {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: 'mole-logistics',
                state: 'open',
                labels: 'needs-review, faculty-profile'
              });

              let issueCloseStr = '';
              const targetIssue = issues.find(issue => 
                (issue.title && issue.title.includes(submitterName)) || 
                (issue.body && issue.body.includes(submitterName))
              );
              if (targetIssue) {
                targetIssueNumber = targetIssue.number.toString();
                console.log(`Matched target issue #${targetIssueNumber} in mole-logistics.`);
                issueCloseStr = `Closes ${context.repo.owner}/mole-logistics#${targetIssueNumber}`
              } else {
                console.log('No matching issue found with the specified name and tags.');
              }
            } catch (err) {
              console.log('Could not fetch issues from mole-logistics:', err.message);
            }

            core.exportVariable('TARGET_ISSUE', issueCloseStr);

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "update faculty profile: ${{ env.FACULTY_NAME }}"
          title: "Faculty Profile Update: ${{ env.FACULTY_NAME }}"
          body: |
            Automated profile update generated from Issue #${{ github.event.issue.number }}.
            
            * **Faculty:** ${{ env.FACULTY_NAME }}
            * **Target File:** `_faculty/${{ env.FACULTY_SLUG }}.md`
            
            Closes #${{ github.event.issue.number }}
            ${{ env.TARGET_ISSUE }}
            
            **NOTE:** For some actions to properly execute, somebody with push access to this repo and `mole-logistics` should merge the PR.  
          branch: "update-faculty/${{ env.FACULTY_SLUG }}"
          base: "main"
          delete-branch: true

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thanks @${context.actor}! An automated Pull Request has been generated for your profile update. Organizers will review and merge it shortly.`
            })