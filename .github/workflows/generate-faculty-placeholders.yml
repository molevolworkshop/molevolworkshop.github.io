name: Generate Faculty Placeholders

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '_data/faculty-registry.csv'

jobs:
  create-placeholders:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Placeholder Pages
        run: |
          python3 - << 'EOF'
          import csv
          import os
          import re
          import unicodedata

          csv_path = '_data/faculty-registry.csv'
          faculty_dir = '_faculty'
          master_template_path = os.path.join(faculty_dir, 'faculty_template.md')

          if not os.path.exists(csv_path):
              print(f"Error: Registry CSV not found at {csv_path}")
              exit(1)

          if not os.path.exists(master_template_path):
              print(f"Error: Master template not found at {master_template_path}")
              exit(1)

          with open(master_template_path, 'r', encoding='utf-8') as f:
              master_template_content = f.read()

          repo = os.environ.get('GITHUB_REPOSITORY', 'molevolworkshop/molevolworkshop.github.io')

          with open(csv_path, 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  # Flexible header matching for name and ID
                  name = row.get('name') or row.get('Name') or ''
                  person_id = row.get('ID') or row.get('id') or row.get('item_id') or ''

                  name = name.strip()
                  person_id = person_id.strip()

                  if not name or name.startswith('--'):
                      continue

                  # Prefer explicit ID for filename slug if available, otherwise slugify full name
                  if person_id:
                      slug = person_id.lower()
                  else:
                      nfkd_form = unicodedata.normalize('NFKD', name)
                      ascii_name = "".join([c for c in nfkd_form if not unicodedata.combining(c)])
                      slug = re.sub(r'[^a-z0-9]+', '-', ascii_name.lower()).strip('-')

                  if not slug:
                      continue

                  file_path = os.path.join(faculty_dir, f"{slug}.md")

                  if os.path.exists(file_path):
                      print(f"Skipping (already exists): {name} -> {file_path}")
                      continue

                  print(f"Creating placeholder for: {name} -> {file_path}")

                  edit_link = f"https://github.com/{repo}/blob/main/{file_path}"

                  page_content = (
                      master_template_content
                      .replace('title: "Faculty Template"', f'title: "{name}"')
                      .replace('name: "Faculty Name"', f'name: "{name}"')
                      .replace('(Filler_link)', f'({edit_link})')
                  )

                  with open(file_path, 'w', encoding='utf-8') as pf:
                      pf.write(page_content)
          EOF

      - name: Commit and Push Placeholder Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "automatically generate missing faculty placeholder pages"
          branch: main