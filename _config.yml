title: Workshop on Molecular Evolution
logo_filename: tshirt-2019.png
email: moledirector@mbl.edu
description: >-
  Since 1988, the Workshop on Molecular Evolution at Woods Hole has 
  provided essential training in the theory and methods of molecular evolution.


header_pages:
   - about.md
   - people.md
   - schedule.md
   - other.md

defaults:
  #Global default for everything else in your site
  - scope:
      path: ""
    values:
      layout: "default"

  #Specific override for everything inside your labs folder
  - scope:
      path: "materials/labs"
    values:
      layout: "default"

#not maintained
#twitter_username: jekyllrb
#facebook_username: MolEvolWorkshop
#github_username:  molevolworkshop
show_excerpts: true

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  faculty:
    output: true
    permalink: /faculty/:name/
  
